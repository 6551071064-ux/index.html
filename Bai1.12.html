<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>
        Tạo form và các điều khiển
    </title>
</head>

<body>

<form id="frmDangKy">

    <table
        border="1"
        cellpadding="4"
        cellspacing="0"
        align="center"
        width="600"
        style="
            border-collapse: collapse;
            background-color: #E6FFDD;
            color: #336633;
        "
    >

        <!-- Tiêu đề -->

        <tr>
            <td
                colspan="2"
                align="center"
                style="
                    font-size: 22px;
                    font-weight: bold;
                    color: #336600;
                "
            >
                Phiếu đăng ký tham gia chương trình khuyến mãi
            </td>
        </tr>


        <!-- Họ và tên -->

        <tr>
            <td width="220">
                Họ và tên
            </td>

            <td>
                <input
                    type="text"
                    id="txtHoTen"
                    size="35"
                    value="Nguyễn Ngọc Quỳnh Nga"
                >
            </td>
        </tr>


        <!-- Địa chỉ -->

        <tr>
            <td>
                Địa chỉ
            </td>

            <td>
                <input
                    type="text"
                    id="txtDiaChi"
                    size="30"
                    value="28Bis Hùng Vương, Q10"
                >
            </td>
        </tr>


        <!-- Điện thoại -->

        <tr>
            <td>
                Điện thoại
            </td>

            <td>
                <input
                    type="text"
                    id="txtDienThoai"
                    value="0909097506"
                >
            </td>
        </tr>


        <!-- Phái -->

        <tr>
            <td>
                Phái
            </td>

            <td>

                <input
                    type="radio"
                    name="phai"
                    id="nam"
                    value="Nam"
                >
                Nam

                <input
                    type="radio"
                    name="phai"
                    id="nu"
                    value="Nữ"
                    checked
                >
                Nữ

            </td>
        </tr>


        <!-- Nghề nghiệp -->

        <tr>
            <td>
                Nghề nghiệp
            </td>

            <td>

                <select id="ngheNghiep">

                    <option value="Bác sĩ">
                        Bác sĩ
                    </option>

                    <option value="Kỹ sư">
                        Kỹ sư
                    </option>

                    <option value="Giáo viên">
                        Giáo viên
                    </option>

                    <option value="Khác">
                        Khác
                    </option>

                </select>

            </td>
        </tr>


        <!-- Chọn sản phẩm -->

        <tr>

            <td>
                Chọn sản phẩm tham gia
            </td>

            <td>

                <select
                    id="sanPham"
                    size="4"
                    multiple
                >

                    <option value="Kem đánh răng" selected>
                        Kem đánh răng
                    </option>

                    <option value="Bột giặt">
                        Bột giặt
                    </option>

                    <option value="Dầu gội đầu">
                        Dầu gội đầu
                    </option>

                    <option value="Sữa tắm">
                        Sữa tắm
                    </option>

                </select>

            </td>

        </tr>


        <!-- Số người dự đoán -->

        <tr>
            <td>
                Số người dự đoán tham gia
            </td>

            <td>
                <input
                    type="text"
                    id="txtSoNguoi"
                    value="250000"
                >
            </td>
        </tr>


        <!-- Nút Đồng ý -->

        <tr>
            <td colspan="2" align="center">

                <input
                    type="button"
                    value="Đồng ý"
                    onclick="dangKy()"
                >

            </td>
        </tr>


        <!-- Thông báo -->

        <tr>
            <td colspan="2">

                <div
                    id="lblThongBao"
                    style="
                        text-align: center;
                        color: red;
                        font-weight: bold;
                    "
                ></div>

            </td>
        </tr>

    </table>

</form>


<script>

    function dangKy() {

        document.getElementById("lblThongBao").innerText =
            "Bạn đã đăng ký thành công!!!";

    }

</script>

</body>
</html>
