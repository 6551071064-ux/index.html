<!DOCTYPE html>
<html>
<head>
    <title>Đăng ký du lịch</title>
</head>

<body>

<form>
    <h2 align="center">Đăng ký du lịch</h2>

    <table border="1" width="500">

        <tr>
            <td>Họ và tên</td>
            <td>
                <input type="text" name="hoten" size="35">
            </td>
        </tr>

        <tr>
            <td>Địa chỉ</td>
            <td>
                <input type="text" name="diachi" size="25">
            </td>
        </tr>

        <tr>
            <td>Điện thoại</td>
            <td>
                <input type="text" name="dienthoai" size="15">
            </td>
        </tr>

        <tr>
            <td>Khách Việt Nam</td>
            <td>
                <input type="checkbox" name="vietnam">
            </td>
        </tr>

        <tr>
            <td>Chọn tour</td>
            <td>
                <select name="tour">
                    <optgroup label="Miền Bắc">
                        <option value="hanoi-halong">Hà Nội - Hạ Long - Sapa</option>
                        <option value="hanoi-chuahuong">Hà Nội - Chùa Hương - Ninh Bình</option>
                        <option value="hanoi-catba">Hà Nội - Cát Bà - Tuần Châu</option>
                    </optgroup>

                    <optgroup label="Miền Trung">
                        <option value="hue-danang">Huế - Bạch Mã - Đà Nẵng</option>
                        <option value="nhatrang-dalat">Nha Trang - Đà Lạt</option>
                        <option value="buonmethuoat">Buôn mê thuột - Gia lai - Kontum</option>
                    </optgroup>

                    <optgroup label="Miền Nam">
                        <option value="tphcm-cantho">TP.HCM - Cần Thơ - Cà Mau</option>
                    </optgroup>
                </select>
            </td>
        </tr>

        <tr>
            <td>Phương tiện</td>
            <td>
                <input type="radio" name="phuongtien" value="maybay">
                Máy bay

                <input type="radio" name="phuongtien" value="oto" checked>
                Xe ô tô
            </td>
        </tr>

        <tr>
            <td colspan="2">

                <fieldset>
                    <legend>Số lượng đoàn khách</legend>

                    Người lớn:
                    <input type="text" name="nguoilon" size="5">

                    Trẻ em:
                    <input type="text" name="treem" size="5">

                </fieldset>

            </td>
        </tr>

        <tr>
            <td>Ghi chú thêm</td>
            <td>
                <textarea name="ghichu" rows="3" cols="35"></textarea>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Đồng ý">
            </td>
        </tr>

    </table>

</form>

</body>
</html>
