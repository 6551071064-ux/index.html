    <h2 align="center" style="color: green;">Định dạng văn bản</h2>

    <p>
        <b><u>Hóa học:</u></b> <i>Nước:</i> <font color="#FF0000">H<sub>2</sub>O</font> ; <i>Axit Sunfuric:</i> <font color="#FF0000">H<sub>2</sub>SO<sub>4</sub></font><br>

        <b><u>Tin học:</u></b> <i>Vòng lập For:</i>
    </p>

    <pre style="background-color: #CCCCCC; color: #0000CC;">
          For I = 0 To 10

               Tong = Tong + I

          Next
    </pre>
